# Local development only. PORT comes from .env so parallel worktrees can run side by side.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    tty: true
    stdin_open: true

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/jobs
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    env_file: .env
    depends_on:
      - web

volumes:
  bundle:
    name: harbor-bundle
